# Codex empirical economics workflow configuration
# Merge selected sections into your real ~/.codex/config.toml

model = "__MODEL__"
model_provider = "__PROVIDER_NAME__"
model_reasoning_effort = "medium"
disable_response_storage = true

[model_providers.__PROVIDER_NAME__]
name = "__PROVIDER_NAME__"
base_url = "__PROVIDER_URL__"
wire_api = "responses"
requires_openai_auth = true

sandbox_mode = "workspace-write"

[features]
multi_agent = true
memories = true
skill_approval = true

[mcp_servers.zotero]
command = "zotero-mcp"
args = ["serve"]
enabled = false

[mcp_servers.zotero.env]
ZOTERO_API_KEY = "your-api-key"
ZOTERO_LIBRARY_ID = "your-library-id"
ZOTERO_LIBRARY_TYPE = "user"
UNPAYWALL_EMAIL = "your-email@example.com"
UNSAFE_OPERATIONS = "all"

[agents.literature-reviewer]
description = "Empirical economics literature review with source mapping and version tracking"
config_file = "~/.codex/agents/literature-reviewer/config.toml"

[agents.data-analyst]
description = "Stata-first empirical analysis for sample construction, specifications, and table planning"
config_file = "~/.codex/agents/data-analyst/config.toml"

[agents.theory-auditor]
description = "Theory-facing auditor for interpreting empirical results and proposing disciplined next-step memos"
config_file = "~/.codex/agents/theory-auditor/config.toml"

[agents.rebuttal-writer]
description = "Economics journal revision-letter and referee-response specialist"
config_file = "~/.codex/agents/rebuttal-writer/config.toml"

[agents.paper-miner]
description = "Extract empirical economics writing patterns from papers and revision materials"
config_file = "~/.codex/agents/paper-miner/config.toml"

[agents.paper-critic]
description = "Read-only critic for empirical economics manuscripts"
config_file = "~/.codex/agents/paper-critic/config.toml"

[agents.paper-fixer]
description = "Conservative fixer for manuscript issues identified by paper-critic"
config_file = "~/.codex/agents/paper-fixer/config.toml"

[agents.response-critic]
description = "Read-only critic for economics response letters"
config_file = "~/.codex/agents/response-critic/config.toml"

[agents.response-fixer]
description = "Conservative fixer for issues identified by response-critic"
config_file = "~/.codex/agents/response-fixer/config.toml"

[agents.artifact-verifier]
description = "Final verifier for QA loops with hard gates, scores, and stop conditions"
config_file = "~/.codex/agents/artifact-verifier/config.toml"
